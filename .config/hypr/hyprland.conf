# -----------------------------------------------------
# 🌈 ULTIMATE CRAZY GLASS RICE - HYPRLAND (NEON Edition)
# -----------------------------------------------------

# MONITOR SETUP
# Syntax: monitor=name,res@hz,offset,scale
# eDP-1 (Left): 2560x1600. Offset is 0x0
monitor = eDP-1, 2560x1600@165.04, 0x0, 1
# HDMI-A-1 (Middle/Main): 1920x1080. Offset is 2560x0 (Starts after eDP-1)
monitor = HDMI-A-1, 1920x1080@143.98, 2560x0, 1
# DP-1 (Right): 1920x1080. Offset is 4480x0 (2560 + 1920 = 4480)
monitor = DP-1, 1920x1080@60.00, 4480x0, 1

# ENVIRONMENT
env = XCURSOR_SIZE, 24
env = GTK_THEME, Adwaita-dark
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# AUTOSTART
exec-once = pkill swaybg; swaybg -i /home/frqme/.config/hypr/wallpapers/bg.jpg -m fill
exec-once = ~/.config/waybar/launch.sh
exec-once = dunst
exec-once = nm-applet --indicator

# INPUT
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0.15
    accel_profile = flat
    touchpad {
        natural_scroll = true
    }
}

# GENERAL
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # CLEAN OFF-WHITE GLOW BORDER
    col.active_border = rgba(dcdcdcee) rgba(8899aaee) 45deg
    col.inactive_border = rgba(313244aa)

    layout = dwindle
    allow_tearing = false
}

# DECORATION
decoration {
    rounding = 10
    active_opacity = 0.90
    inactive_opacity = 0.80

    blur {
        enabled = true
        size = 6
        passes = 3
        ignore_opacity = true
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(ffffff1a) # Subtle White Glow
        offset = 0, 0
    }
}

# ANIMATIONS (Smooth & Clean)
animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 4, default
}

# LAYOUTS
dwindle {
    pseudotile = yes
    preserve_split = yes
    force_split = 2
}

# MISC
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = false
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}

# WINDOW RULES (Modern Block Syntax)
windowrule {
    name = kitty-opacity
    match:class = ^(kitty)$
    opacity = 0.85
}

windowrule {
    name = float-pavu
    match:class = ^(pavucontrol)$
    float = on
}

# LAYER RULES
layerrule {
    name = waybar-blur
    match:namespace = ^(waybar)$
    blur = on
}

layerrule {
    name = rofi-blur
    match:namespace = ^(rofi)$
    blur = on
}

layerrule {
    name = dunst-blur
    match:namespace = ^(dunst)$
    blur = on
}

layerrule {
    name = notifications-blur
    match:namespace = ^(notifications)$
    blur = on
}

# KEYBINDINGS
$mainMod = SUPER
bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, thunar
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, V, togglefloating,
bind = $mainMod, T, exec, firefox

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Workspace Switch (SUPER + 1-9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move to Workspace (SUPER + SHIFT + 1-9)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Mouse Binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Brightness and Audio
binde=, XF86MonBrightnessUp, exec, brightnessctl set +5%
binde=, XF86MonBrightnessDown, exec, brightnessctl set 5%-
binde=, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
